services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: wxc-monitor
      POSTGRES_PASSWORD: wxc-monitor
      POSTGRES_DB: wxc-monitor
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wxc-monitor"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    container_name: wxc-monitor
    build: .
    # To deploy from DockerHub instead of building locally, replace the line above with:
    image: diegofn/wxc-monitor:latest
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env                         # create this file on the server (see .env.example)
    environment:
      # Always override DB URL so the host is 'db' (docker service), not localhost
      SQLALCHEMY_DATABASE_URL: postgresql://wxc-monitor:wxc-monitor@db/wxc-monitor

volumes:
  pgdata:
